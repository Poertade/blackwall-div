# Gera o jogo empacotado (executável, sem precisar de Python) e guarda o zip
# nos artefatos da execução: Actions → empacotar → a execução → Artifacts.
name: empacotar

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  empacotar:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements-build.txt
      - name: Empacotar
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/empacotar.py
      - name: Abrir o executável e fechar sozinho (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $jogo = Start-Process -FilePath "dist\blackwall-dive\blackwall-dive.exe" `
            -ArgumentList "--sair-apos", "5", "--salvamento", "$env:RUNNER_TEMP\save" -Wait -PassThru
          if ($jogo.ExitCode -ne 0) { throw "o jogo empacotado fechou com o código $($jogo.ExitCode)" }
          if (-not (Test-Path "$env:RUNNER_TEMP\save\save.json")) { throw "o jogo não salvou" }
      - name: Abrir o executável e fechar sozinho (Linux)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          dist/blackwall-dive/blackwall-dive --sair-apos 5 --salvamento "$RUNNER_TEMP/save"
          test -f "$RUNNER_TEMP/save/save.json"
      - uses: actions/upload-artifact@v4
        with:
          name: blackwall-dive-${{ runner.os }}
          path: dist/blackwall-dive-*.zip
          retention-days: 30
