  tags: [sobrecarga]
  rarity: comum
  max: 3
  stats: {crit_chance: 0.08, crit_mult: 0.25}
  desc: +8% de chance de crítico e +25% de dano crítico.

sobretensao:
  name: Sobretensão
  tags: [sobrecarga, cadeia]
  rarity: comum
  max: 3
  requires_hack: short_circuit
  hacks: {short_circuit: {damage: 0.5}}
  desc: Short Circuit +50% de dano.

dissipador:
  name: Dissipador
  tags: [sobrecarga]
  rarity: comum
  max: 2
  stats: {ram: 3}
  requires_hack: synapse_burnout
  hacks: {synapse_burnout: {cooldown: 0.2}}
  desc: +3 de RAM e Synapse Burnout recarrega 20% mais rápido.

burnout:
  name: Burnout
  tags: [sobrecarga]
  rarity: raro
  max: 2
  flags: {execute: 0.6}
  desc: Até +60% de dano quanto menos vida o alvo tem.

overclock:
