# Os ups: as melhorias que você escolhe entre uma onda e outra (1 de 3). Só números (Integridade,
# dano, recarga, RAM...). Os efeitos especiais (saltos, alvos extras, envenenar ao queimar) ficam nas
# árvores de cada hack, no esconderijo (data/hack_trees.yaml).
#
# tags: a build que o up puxa (contagio, sobrecarga, cadeia, controle; sem tag = serve a todas).
#   Um up de build só aparece se algum hack do deck tiver essa tag.
# rarity: comum, raro ou epico. max: quantas vezes dá para pegar.
#
# O que um up pode mudar:
#   stats:        números da netrunner (veja blackwall/sim/stats.py)
#   tag_damage:   +dano dos hacks de uma tag
#   tag_cooldown: recarga mais rápida dos hacks de uma tag

# --- Contágio ------------------------------------------------------------------
virulencia:
  name: Virulência
  tags: [contagio]
  rarity: comum
  max: 4
  stats: {dot: 0.3}
  desc: +30% de dano de veneno e de queimadura.

incubacao:
  name: Incubação
  tags: [contagio]
  rarity: comum
  max: 3
  stats: {dot_duration: 1.5}
