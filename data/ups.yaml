# Os ups: as melhorias que você escolhe entre uma onda e outra (1 de 3).
#
# tags: a build que o up puxa (contagio, sobrecarga, cadeia, controle; sem tag = serve a todas).
# rarity: comum, raro ou epico. max: quantas vezes dá para pegar.
# requires_hack: só aparece se esse hack estiver no deck.
#
# O que um up pode mudar:
#   stats:      números da netrunner (veja blackwall/sim/stats.py)
#   tag_damage: +dano dos hacks de uma tag
#   hacks:      números de um hack (damage: +%, ram: +RAM, cooldown: % mais rápido,
#               duration: +segundos, radius: +raio, jumps: +saltos, spread: +alvos)
#   flags:      regras especiais (veja blackwall/sim/dive.py)

# --- Contágio: espalhar o dano -------------------------------------------------
mutacao:
  name: Mutação
  tags: [contagio]
  rarity: comum
  max: 3
  requires_hack: contagion
  hacks: {contagion: {spread: 1}}
  desc: Contagion pula para +1 alvo.

incubacao:
  name: Incubação
  tags: [contagio]
  rarity: comum
  max: 3
  stats: {dot_duration: 2}
  desc: Venenos e queimaduras duram +2 s.

virulencia:
  name: Virulência
  tags: [contagio]
  rarity: comum
  max: 4
  stats: {dot: 0.3}
  desc: +30% de dano de veneno e de queimadura.

carga_viral:
  name: Carga viral
  tags: [contagio]
  rarity: comum
  max: 2
  requires_hack: contagion
  hacks: {contagion: {ram: -1, cooldown: 0.15}}
  desc: Contagion custa -1 de RAM e recarrega 15% mais rápido.

imunodeficiencia:
  name: Imunodeficiência
  tags: [contagio]
  rarity: raro
  max: 2
  flags: {imuno: 0.15}
  desc: Alvos envenenados tomam +15% de todo dano.

epidemia:
  name: Epidemia
  tags: [contagio]
  rarity: raro
  max: 1
  flags: {epidemia: 1}
  desc: Quem morre envenenado contamina quem está em volta.

paciente_zero:
  name: Paciente zero
  tags: [contagio, cadeia]
  rarity: raro
  max: 1
  requires_hack: overheat
  flags: {paciente_zero: 1}
  desc: Overheat também envenena.

# --- Sobrecarga: dano alto, cadência baixa -------------------------------------
capacitor:
  name: Capacitor
  tags: [sobrecarga]
  rarity: comum
  max: 3
  tag_damage: {sobrecarga: 0.4}
