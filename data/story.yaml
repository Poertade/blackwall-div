# A quest line: os personagens, as mensagens, os três caminhos, as missões, a equipe e os finais.
#
# beats: mensagens que chegam no esconderijo quando a condição bate.
#   when: {start: true} (no primeiro jogo), {layers: N} (N camadas vencidas), {path: equipe} (depois
#   de escolher o caminho), {mission: id} (depois de cumprir a missão).
#   choice: path liga a escolha dos três caminhos (uma vez por salvamento, para sempre).
# missions: de 5 a 8 ondas, com um objetivo:
#   survive (aguentar até a extração), download (proteger o nó até o download terminar),
#   escort (proteger o programa até ele atravessar), nodes (destruir os nós de cada onda),
#   hunt (derrubar o alvo que aparece na última onda).
#   requires: {layers: N}. layer: o ambiente e os ICE (índice da camada). reward: ed, hack, deck, ally.

characters:
  rhyme: {name: Rhyme, role: fixer de Watson, color: yellow}
  juno: {name: Juno Takeda, role: netrunner, color: cyan}
  halloran: {name: Agente Halloran, role: recrutadora da Netwatch, color: blue}
  voz: {name: "???", role: do outro lado da Blackwall, color: red}

beats:
  - id: inicio
    when: {start: true}
    from: rhyme
    text: |
      Então você é a runner nova. Bom. Eu sou a Rhyme, e Watson inteiro passa pelo meu telefone.
      Tenho um serviço simples: as subredes de Watson estão cheias de ICE velho guardando dado novo.
      Mergulhe, limpe o caminho e traga o que conseguir. Se o Kraken acordar, corra. Ou não, se for boa.

  - id: rosto_novo
    when: {prestige: 1}
    from: rhyme
    text: |
      Rosto novo, mesmo jeito de mexer no deck. Não vou perguntar o que você viu do outro lado da Blackwall.
      Watson continua aqui, e o Kraken também. Dessa vez você já sabe o caminho.

  - id: primeira_volta
    when: {dives: 1}
    from: rhyme
    text: |
      Voltou inteira. Já é mais do que metade dos novatos. O Ed que você trouxe compra RAM, cyberdeck e
      quickhack no mercado do Kabuki. Gaste. Runner pão-dura morre com o Ed no bolso.

  - id: encruzilhada
    when: {layers: 1}
    from: rhyme
    choice: path
    text: |
      O Kraken caiu e a cidade ouviu. Chegaram dois recados para você, e eu sou só a mensageira.
      A Juno Takeda quer montar uma equipe: runners que cobrem as suas costas e trabalham enquanto você dorme.
      A Netwatch também ligou. Uma tal de Agente Halloran. Salário, deck de primeira e um crachá que abre portas.
      Ou você recusa os dois e segue sozinha, como sempre foi. Pense bem: essa escolha não volta.

  - id: escolheu_solo
    when: {path: solo}
    from: rhyme
    text: |
      Sozinha, então. Eu respeito. Sem ninguém para dividir o Ed e sem ninguém para te arrastar para fora
      do flatline. Cada onda que você atravessar sem levar um arranhão vai te deixar mais afiada.

  - id: escolheu_equipe
    when: {path: equipe}
    from: juno
    text: |
      Sabia que você ia topar. Eu cuido do dano; os outros dois chegam quando a gente provar que funciona.
      Enquanto você mergulha, eu recolho o Ed que cai. Enquanto você dorme, a gente pega serviço pequeno.
      Treine a equipe no esconderijo: runner parada enferruja.

  - id: escolheu_netwatch
    when: {path: netwatch}
    from: halloran
    text: |
      Bem-vinda à Netwatch. O Agente Varga vai mergulhar com você; ele já viu coisa que você nem imagina.
      O salário cai todo mês, esteja você conectada ou não. Em troca, a gente pede o que a Netwatch sempre
      pede: que o que está do outro lado da Blackwall continue do outro lado.

  - id: voz_1
    when: {layers: 2}
    from: voz
    text: |
      vOcê eStá oUvInDo? nÃo é eCo. eU vEjO o sEu dEcK dAqUi. vEnHa mAiS fUnDo.

  - id: voz_2
    when: {layers: 3}
    from: voz
    text: |
      A Old Net lembra de tudo. Eu também. A Blackwall não é um muro, runner. É uma jaula. E toda jaula
      tem dois lados.

  - id: voz_3
    when: {layers: 4}
    from: voz
    text: |
      Você chegou ao muro. Do outro lado não há monstro. Há eu. Atravesse, e então decida quem estava preso.

missions:
  # --- solo -----------------------------------------------------------------
  - id: solo_1
    path: solo
    requires: {layers: 1}
    from: rhyme
    name: Sem rede de segurança
    brief: Um servidor de Watson vai cair em minutos e leva junto quem estiver conectado. Aguente até a extração.
    layer: 0
    waves: 6
    budget: 1.3
    objective: {type: survive}
    reward: {ed: 500, hack: detonate_grenade}

  - id: solo_2
    path: solo
    requires: {layers: 2}
    from: rhyme
    name: O dado roubado
    brief: Um download de um servidor da Militech. O nó fica parado no meio da rede; o ICE vai querer derrubá-lo.
    layer: 1
    waves: 6
    objective: {type: download, hp: 400}
    reward: {ed: 1200, hack: cyberpsychosis}

  - id: solo_3
    path: solo
    requires: {layers: 3}
    from: rhyme
    name: Caçada na Old Net
    brief: Um caçador da Arasaka está rastreando runners solitárias. Ele aparece na última onda. Derrube-o primeiro.
    layer: 2
    waves: 7
    objective: {type: hunt, target: kurogane}
    reward: {ed: 2500, hack: system_reset}

  # --- equipe ---------------------------------------------------------------
  - id: equipe_1
    path: equipe
    requires: {layers: 1}
    from: juno
    name: Primeiro serviço juntas
    brief: Eu puxo o dado, você segura o ICE longe do nó. Cinco ondas e a gente prova que funciona.
    layer: 0
    waves: 5
    objective: {type: download, hp: 300}
    reward: {ed: 400, ally: ruido}

  - id: equipe_2
    path: equipe
    requires: {layers: 2}
    from: juno
    name: Tirar a Mira da Arasaka
    brief: A Mira está presa num contrato da Arasaka. O programa dela vai atravessar a rede; escolte até o outro lado.
    layer: 1
    waves: 6
    objective: {type: escort, hp: 450}
    reward: {ed: 1000, ally: mira, hack: memory_wipe}

  - id: equipe_3
    path: equipe
    requires: {layers: 3}
    from: juno
    name: O golpe na Militech
    brief: Os nós de segurança da Militech se regeneram. Destrua os de cada onda, e a equipe leva o cofre.
    layer: 2
    waves: 6
    objective: {type: nodes, per_wave: 2}
    reward: {ed: 2500, hack: cyberpsychosis}

  # --- netwatch -------------------------------------------------------------
  - id: netwatch_1
    path: netwatch
    requires: {layers: 1}
    from: halloran
    name: Contenção
    brief: Nós de uma IA solta apareceram em Watson. Destrua todos antes que eles se espalhem.
    layer: 0
    waves: 5
    objective: {type: nodes, per_wave: 2}
    reward: {ed: 400, hack: weapon_glitch}

  - id: netwatch_2
    path: netwatch
    requires: {layers: 2}
    from: halloran
    name: Os Voodoo Boys
    brief: Severin, dos Voodoo Boys, está conversando com o que não devia. Ele aparece na última onda. Traga-o desconectado.
    layer: 1
    waves: 6
    objective: {type: hunt, target: severin}
    reward: {ed: 1200, hack: system_reset}

  - id: netwatch_3
    path: netwatch
    requires: {layers: 3}
    from: halloran
    name: A IA que fugiu
    brief: Algo atravessou a Blackwall pela Old Net. Segure a brecha até a equipe de contenção chegar.
    layer: 2
    waves: 7
    budget: 1.2
    objective: {type: survive}
    reward: {ed: 2500, hack: cyberpsychosis}

# Os aliados: mergulham junto e lançam hacks sozinhos. role: dano, controle, suporte.
# Cada nível (treinado no esconderijo) soma level_bonus ao que ele faz.
allies:
  juno:
    name: Juno Takeda
    role: dano
    color: cyan
    every: 1.6
    damage: 14
    jumps: 2
    desc: Short Circuit em cadeia a cada 1,6 s.
  ruido:
    name: Bento "Ruído" Okafor
    role: controle
    color: violet
    every: 3.0
    damage: 6
    stun: 1.0
    radius: 90
    desc: Sonic Shock no maior grupo de ICE a cada 3 s.
  mira:
    name: Mira Solano
    role: suporte
    color: green
    every: 4.0
    heal: 0.04
    ram: 1.0
    desc: A cada 4 s, devolve 4% da Integridade e 1 de RAM.
  varga:
    name: Agente Varga
    role: dano
    color: blue
    every: 1.2
    damage: 24
    stun: 0.4
    jumps: 0
    desc: Synapse Burnout da Netwatch a cada 1,2 s; atordoa.

team:
  equipe: [juno]          # quem chega ao escolher o caminho (os outros chegam pelas missões)
  netwatch: [varga]

path_decks:
  netwatch: netdriver     # o deck que o caminho entrega na hora

ally_level:
  max: 10
  cost: 250               # o preço do nível 2; cada nível seguinte custa growth vezes o anterior
  growth: 1.55
  bonus: 0.2              # +20% de efeito por nível

# A renda enquanto você não mergulha (inclusive com o jogo fechado), em Ed por hora.
income:
  equipe: {per_hour: 70, per_ally_level: 0.12, cap_hours: 12}
  netwatch: {per_hour: 45, per_ally_level: 0.1, cap_hours: 12}
  pickup: 80              # no mergulho, a equipe recolhe o Ed que cai perto de cada aliado

paths:
  solo:
    name: Solo
    color: yellow
    who: rhyme
    desc: Você recusa os dois convites. +25% de dano, +20 de Integridade, 4 opções de up e o Lobo solitário.
  equipe:
    name: Equipe netrunner
    color: cyan
    who: juno
    desc: Juno e mais dois runners mergulham com você e recolhem o Ed. Fora do mergulho, a equipe rende Ed por hora.
  netwatch:
    name: Netwatch
    color: blue
    who: halloran
    desc: O Agente Varga mergulha com você, o Netdriver MK.5 de 7 slots e um salário por hora. +12% de dano.

endings:
  solo:
    title: A runner que atravessou sozinha
    text: |
      A IA renegada cai em mil pedaços de luz, e por um instante você vê o outro lado: não um inferno, um
      oceano de dado sem dono. Ninguém em Night City vai saber que foi você. A Rhyme sabe. Ela paga em
      dobro e não pergunta nada. Lá fora a chuva continua. Aqui dentro, pela primeira vez, você ouve o silêncio.
  equipe:
    title: Uma equipe que voltou inteira
    text: |
      A Juno puxa você pelo cabo antes do último pulso da IA. O Ruído ri alto demais e a Mira já está contando
      o Ed. Vocês derrubaram o que estava atrás do muro e ninguém ficou para trás. Na semana seguinte, o
      telefone da Rhyme não para: todo mundo quer a equipe que voltou da Blackwall.
  netwatch:
    title: O crachá da Netwatch
    text: |
      A IA está contida. A Halloran manda uma mensagem curta: "Bom trabalho, agente." O Varga não diz nada,
      só desconecta. Você fica olhando o muro remendado por mais tempo do que devia. A voz do outro lado não fala
      mais. O salário cai na conta. Você se pergunta, pela primeira vez, quem estava preso.
