# Os quickhacks (os nomes do Cyberpunk 2077).
#
# kind: combate, controle, furtivo ou supremo. tags: as builds que o hack ajuda (e que os ups dele contam).
# ram: o custo. cooldown e upload em segundos (o upload é o tempo até o hack chegar no alvo).
# target: enemy (o inimigo sob o cursor) ou point (o ponto do cursor).
# price: o preço na loja, em Ed (0 = começa com ele). O que cada número faz está em blackwall/sim/hacks.py.

short_circuit:
  name: Short Circuit
  kind: combate
  tags: [sobrecarga, cadeia]
  color: cyan
  ram: 2
  cooldown: 0.5
  upload: 0.15
  target: enemy
  damage: 16
  jumps: 0
  jump_range: 170
  falloff: 0.8            # cada salto leva 80% do dano do anterior
  price: 0
  desc: Dano elétrico no alvo.

