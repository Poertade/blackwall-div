# As árvores de cada quickhack: os efeitos especiais (saltos, alvos extras, envenenar ao queimar...),
# comprados com Ed no esconderijo e válidos para todos os mergulhos. Só aparecem para os hacks que você tem.
#
# Cada nó: name, desc, max (níveis), cost (o 1º nível), growth (cada nível seguinte custa growth vezes o
# anterior), requires (outro nó da mesma árvore, com pelo menos 1 nível), pos [coluna, linha] e effect:
# o que cada nível soma, com as chaves dos ups (hacks: números do hack; flags: regras especiais).
# Os nós com requires ficam ocultos até o nó anterior ser comprado.

